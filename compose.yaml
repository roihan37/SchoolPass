name: schoolpass
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Isi POSTGRES_DB di .env}
      POSTGRES_USER: ${POSTGRES_USER:?Isi POSTGRES_USER di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  minio:
    build:
      context: ./docker/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Isi MINIO_ROOT_USER di .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Isi MINIO_ROOT_PASSWORD di .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
